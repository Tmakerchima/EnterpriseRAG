[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-eval"
version = "0.1.0"
description = "Deterministic, auditable evaluation harness for EnterpriseRAG"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.16.3",
]
judge = [
  "deepeval>=2.0,<3",
]
supplemental = [
  "ragas>=0.3,<1",
]

[project.scripts]
enterprise-rag-eval = "enterprise_rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
pythonpath = ["src", "."]
addopts = "-q"
