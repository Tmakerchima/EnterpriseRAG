name: EnterpriseRAG CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml test

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evaluation/pyproject.toml
      - run: python -m pip install -e 'evaluation[dev]'
      - run: python -m pytest
        working-directory: evaluation
      - run: python -m ruff check src tests
        working-directory: evaluation
      - run: python -m enterprise_rag_eval smoke --out reports/ci-smoke
        working-directory: evaluation
      - run: python -m enterprise_rag_eval report --run reports/ci-smoke --frontend-out reports/ci-smoke/frontend-latest.json
        working-directory: evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-scorecard
          path: evaluation/reports/ci-smoke/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden scope scan
        shell: bash
        run: |
          if rg -n -i 'ResumeContextProvider|PortfolioInfoTools|AgentToolProvider|GITHUB_MCP_PAT|tmakerchima\.cn|about-mac|interview-system|com\.mac\.portfolio' backend frontend; then
            echo 'forbidden runtime/UI scope found'
            exit 1
          fi
      - name: Secret pattern scan
        shell: bash
        run: |
          if rg -n -i '(api[_-]?key|password|token)\s*[:=]\s*[A-Za-z0-9+/]{24,}' backend frontend evaluation --glob '!**/package-lock.json'; then
            echo 'possible secret found'
            exit 1
          fi
      - run: docker compose config
