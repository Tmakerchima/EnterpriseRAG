name: ParadeDB integration

on:
  workflow_dispatch:

jobs:
  paradedb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start ParadeDB
        run: docker compose -f deploy/docker-compose.paradedb.yml up -d --wait
      - name: Run opt-in integration test
        env:
          ENTERPRISE_BM25_INTEGRATION: 'true'
          ENTERPRISE_RAG_BM25_URL: jdbc:postgresql://localhost:5433/enterprise_search
          ENTERPRISE_RAG_BM25_USERNAME: postgres
          ENTERPRISE_RAG_BM25_PASSWORD: postgres
        run: mvn -B -f backend/pom.xml -Dtest=ParadeDbBm25IntegrationTest test
